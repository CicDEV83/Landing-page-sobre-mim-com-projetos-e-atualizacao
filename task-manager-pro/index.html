<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager Pro</title>

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/style.css" />
    
  <body>
    <header class="app-header">
      <h1>Task Manager Pro</h1>
      <p>Organize Suas Tarefas Como Um Engenheiro de Software</p>
      <button id="theme-btn" class="theme-toggle">🌙 Modo Escuro</button>
    </header>

    <main class="app-main">
      <section class="task-form-section">
        <h2>Nova Tarefa</h2>

        <form id="task-form" class="task-form">
          <input
            type="text"
            id="task-input"
            class="task-input"
            placeholder="O que precisa ser feito?"
            required
          />
          <button type="submit" class="btn-primary">Adicionar</button>
        </form>
      </section>
      <section class="task-list-section">
        <h2>Suas Tarefas</h2>

        <ul id="task-list" class="task-list"></ul>
      </section>

      <aside class="app-sidebar">
        <figure class="user-profile">
          <img
            src="https://via.placeholder.com/50"
            alt="Avatar do usuário"
            class="avatar"
          />
          <figcaption>Desenvolvedor(a) Pro</figcaption>
        </figure>

        <div class="stats">
          <h3>Status</h3>
          <p>Total de Tarefas: <span id="total-tasks">0</span></p>
        </div>
      </aside>
    </main>
    
<footer class="app-footer">
  <!-- Botão posicionado logo no início do rodapé -->
  <a href="../index.html" class="btn-back" aria-label="Voltar para a página principal">
    <span class="btn-back__icon">←</span> Voltar ao portfólio geral
  </a>
  <p>&copy; 2026 Task Manager Pro. Todos os direitos reservados.</p>
</footer>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
